version: 2

project_name: classreach

before:
  hooks:
    - go mod tidy

builds:
  - id: classreach
    main: ./cmd/classreach
    binary: classreach
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/jwmoss/classreach/internal/cli.version={{ .Version }}
      - -X github.com/jwmoss/classreach/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/jwmoss/classreach/internal/cli.date={{ .Date }}

archives:
  - id: classreach
    ids:
      - classreach
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: jwmoss
    name: classreach
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"

homebrew_casks:
  - name: classreach
    ids:
      - classreach
    repository:
      owner: jwmoss
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/jwmoss/classreach"
    description: "Command-line client for the ClassReach private API"
    license: MIT
    binaries:
      - classreach
